<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科目學分統計與彙整工具</title>
  
  <!-- 載入 Tailwind CSS 用於排版與樣式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 React 核心庫 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 載入 Babel 用於在瀏覽器即時編譯 React 語法 -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
  <!-- 應用程式渲染目標 -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- 圖示元件 (內聯 SVG，避免 iframe 外部資源載入失敗) ---
    const BookOpen = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
    const PlusCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>;
    const Search = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const AlertCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
    const Upload = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
    const Download = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const Trash2 = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
    const XCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>;

    // --- 主程式區塊 ---
    function App() {
      const [inputText, setInputText] = useState('');
      const [allData, setAllData] = useState([]);
      const [errorMsg, setErrorMsg] = useState('');
      const [selectedIds, setSelectedIds] = useState([]); // 新增：記錄選取的項目 ID

      // 新增：自訂 Modal 狀態 (因為 iframe 中無法使用原生的 alert 和 confirm)
      const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'alert', onConfirm: null });

      const showModal = (title, message, type = 'alert', onConfirm = null) => {
        setModal({ isOpen: true, title, message, type, onConfirm });
      };

      const closeModal = () => setModal(prev => ({ ...prev, isOpen: false }));

      const handleModalConfirm = () => {
        if (modal.onConfirm) modal.onConfirm();
        closeModal();
      };

      const [filters, setFilters] = useState({
        yearSem: [],
        dept: [],
        className: [],
        reqType: [],
        semesterType: [],
        teacher: []
      });

      const handleParse = () => {
        if (!inputText.trim()) {
          setErrorMsg('請先貼上網頁複製的文字內容');
          return;
        }

        try {
          const newData = [];
          let parsedCount = 0;
          let currentYearSem = '未指定學年度/學期';
          let currentDept = '未指定系所/學制';

          const lines = inputText.split('\n');

          lines.forEach(line => {
            const tLine = line.trim();
            if (!tLine) return;

            const headerMatch = tLine.match(/(.*?學年\s*第\s*\d+\s*學期)(.*?)(?:科目資料|選課|$)/);
            if (headerMatch && headerMatch[1].length < 20) {
              currentYearSem = headerMatch[1].replace(/\s+/g, ' ').trim();
              currentDept = headerMatch[2].trim();
              return;
            }

            if (tLine.includes('科目代碼') || tLine.includes('一般服務->') || (tLine.includes('學分') && tLine.length < 20)) {
              return;
            }

            if (line.includes('\t')) {
              const cells = line.split('\t').map(c => c.trim());
              if (cells.length >= 7 && !isNaN(parseFloat(cells[4]))) {
                newData.push({
                  // 避免 iframe 阻擋 crypto.randomUUID，改用安全的方式產生 ID
                  id: Date.now().toString(36) + Math.random().toString(36).substring(2),
                  yearSem: currentYearSem,
                  dept: currentDept,
                  courseNo: cells[0] || '',
                  courseCode: cells[1] || '',
                  courseName: cells[2] || '',
                  className: cells[3] || '',
                  credits: parseFloat(cells[4]) || 0,
                  semesterType: cells[5] || '',
                  reqType: cells[6] || '',
                  maxStudents: cells[7] || '',
                  enrolledStudents: cells[8] || '',
                  teacher: cells[9] || '',
                  notes: cells[10] || ''
                });
                parsedCount++;
              }
            }
          });

          if (parsedCount > 0) {
            setAllData(prev => [...prev, ...newData]);

            // 新增：自動將「貿」開頭的班級加入到篩選條件中（預設勾選）
            const maoClasses = [...new Set(newData.map(item => item.className).filter(c => c && c.startsWith('貿')))];
            if (maoClasses.length > 0) {
              setFilters(prev => ({
                ...prev,
                className: [...new Set([...prev.className, ...maoClasses])]
              }));
            }

            setInputText('');
            setErrorMsg('');
            showModal('成功', `成功解析並新增了 ${parsedCount} 筆課程資料！`, 'alert');
          } else {
            setErrorMsg('無法解析內容。請確認您是直接在網頁上按下 Ctrl+A 全選後複製並貼上。');
          }

        } catch (err) {
          console.error(err);
          setErrorMsg('解析發生錯誤，請檢查文字格式是否正確。');
        }
      };

      const uniqueYearSems = useMemo(() => {
        return [...new Set(allData.map(item => item.yearSem))].sort((a, b) => b.localeCompare(a, 'zh-TW')); 
      }, [allData]);

      const uniqueDepts = useMemo(() => {
        return [...new Set(allData.map(item => item.dept))].sort((a, b) => a.localeCompare(b, 'zh-TW')); 
      }, [allData]);

      const uniqueClasses = useMemo(() => {
        return [...new Set(allData.map(item => item.className))].sort((a, b) => a.localeCompare(b, 'zh-TW')); 
      }, [allData]);

      const uniqueReqTypes = useMemo(() => {
        return [...new Set(allData.map(item => item.reqType))].sort((a, b) => a.localeCompare(b, 'zh-TW')); 
      }, [allData]);

      const uniqueSemesterTypes = useMemo(() => {
        return [...new Set(allData.map(item => item.semesterType))].sort((a, b) => a.localeCompare(b, 'zh-TW')); 
      }, [allData]);

      const uniqueTeachers = useMemo(() => {
        return [...new Set(allData.map(item => item.teacher))].sort((a, b) => a.localeCompare(b, 'zh-TW')); 
      }, [allData]);

      // 新增：當資料被刪除或變動時，自動清除已經不存在的無效過濾條件
      // 避免因為刪除了特定條件的所有資料，導致該條件的 Checkbox 消失但過濾器仍處於啟動狀態
      useEffect(() => {
        setFilters(prev => {
          const newFilters = {
            yearSem: prev.yearSem.filter(v => uniqueYearSems.includes(v)),
            dept: prev.dept.filter(v => uniqueDepts.includes(v)),
            className: prev.className.filter(v => uniqueClasses.includes(v)),
            reqType: prev.reqType.filter(v => uniqueReqTypes.includes(v)),
            semesterType: prev.semesterType.filter(v => uniqueSemesterTypes.includes(v)),
            teacher: prev.teacher.filter(v => uniqueTeachers.includes(v))
          };

          // 檢查是否有任何過濾條件被清除（陣列長度改變），有改變才更新 state 避免無效渲染
          const isChanged = Object.keys(newFilters).some(
            key => newFilters[key].length !== prev[key].length
          );

          return isChanged ? newFilters : prev;
        });
      }, [uniqueYearSems, uniqueDepts, uniqueClasses, uniqueReqTypes, uniqueSemesterTypes, uniqueTeachers]);

      const filteredData = useMemo(() => {
        return allData.filter(item => {
          const matchYear = filters.yearSem.length === 0 || filters.yearSem.includes(item.yearSem);
          const matchDept = filters.dept.length === 0 || filters.dept.includes(item.dept);
          const matchClass = filters.className.length === 0 || filters.className.includes(item.className);
          const matchReq = filters.reqType.length === 0 || filters.reqType.includes(item.reqType);
          const matchSem = filters.semesterType.length === 0 || filters.semesterType.includes(item.semesterType);
          const matchTeacher = filters.teacher.length === 0 || filters.teacher.includes(item.teacher);
          return matchYear && matchDept && matchClass && matchReq && matchSem && matchTeacher;
        });
      }, [allData, filters]);

      const totalCredits = useMemo(() => {
        return filteredData.reduce((sum, item) => sum + item.credits, 0);
      }, [filteredData]);

      const totalCourses = filteredData.length;

      const handleExport = () => {
        if (filteredData.length === 0) {
          showModal('提示', '沒有資料可以匯出', 'alert');
          return;
        }

        const headers = [
          '學年度/學期', '學制/系所', '選課編號', '科目代碼', 
          '科目名稱', '開課班級', '學分數', '學期', 
          '修選別', '人數上限', '選課人數', '授課教師', '註'
        ];
        
        const csvRows = [headers.join(',')];

        filteredData.forEach(item => {
          const row = [
            `"${item.yearSem}"`,
            `"${item.dept}"`,
            `"${item.courseNo}"`,
            `"${item.courseCode}"`,
            `"${item.courseName}"`,
            `"${item.className}"`,
            item.credits,
            `"${item.semesterType}"`,
            `"${item.reqType}"`,
            `"${item.maxStudents}"`,
            `"${item.enrolledStudents}"`,
            `"${item.teacher}"`,
            `"${item.notes}"`
          ];
          csvRows.push(row.join(','));
        });

        const csvString = '\uFEFF' + csvRows.join('\n');
        const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', '課程學分統計表.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const toggleFilter = (filterKey, value) => {
        setFilters(prev => {
          const currentValues = prev[filterKey];
          if (currentValues.includes(value)) {
            return { ...prev, [filterKey]: currentValues.filter(v => v !== value) };
          } else {
            return { ...prev, [filterKey]: [...currentValues, value] };
          }
        });
      };

      // 勾選/取消勾選單筆項目
      const toggleSelection = (id) => {
        setSelectedIds(prev => 
          prev.includes(id) ? prev.filter(itemId => itemId !== id) : [...prev, id]
        );
      };

      // 勾選/取消勾選目前篩選出的所有項目
      const handleSelectAllFiltered = (e) => {
        if (e.target.checked) {
          const filteredIds = filteredData.map(item => item.id);
          // 將目前篩選出的 ID 加到選取名單中（使用 Set 避免重複）
          setSelectedIds(prev => [...new Set([...prev, ...filteredIds])]);
        } else {
          // 將目前篩選出的 ID 從選取名單中移除
          const filteredIds = filteredData.map(item => item.id);
          setSelectedIds(prev => prev.filter(id => !filteredIds.includes(id)));
        }
      };

      // 檢查是否目前篩選出的項目都已經被勾選了
      const isAllFilteredSelected = filteredData.length > 0 && filteredData.every(item => selectedIds.includes(item.id));

      // 刪除選取的項目
      const handleDeleteSelected = () => {
        if (selectedIds.length === 0) return;
        showModal('確認刪除', `確定要刪除選取的 ${selectedIds.length} 筆資料嗎？`, 'confirm', () => {
          setAllData(prev => prev.filter(item => !selectedIds.includes(item.id)));
          setSelectedIds([]); // 刪除後清空選取狀態
        });
      };

      const handleClearAll = () => {
        showModal('確認清空', '確定要清除所有已匯入的資料嗎？', 'confirm', () => {
          setAllData([]);
          setSelectedIds([]);
          setFilters({ yearSem: [], dept: [], className: [], reqType: [], semesterType: [], teacher: [] });
          setErrorMsg('');
        });
      };

      return (
        <div className="min-h-screen bg-gray-50 p-6 font-sans text-gray-800">
          <div className="max-w-7xl mx-auto space-y-6">
            <header className="flex items-center justify-between pb-4 border-b border-gray-200">
              <div className="flex items-center space-x-3">
                <BookOpen className="w-8 h-8 text-blue-600" />
                <h1 className="text-2xl font-bold text-gray-900">科目學分統計與彙整工具</h1>
              </div>
              <div className="text-sm text-gray-500">
                已匯入: <span className="font-bold text-blue-600">{allData.length}</span> 筆
              </div>
            </header>

            <section className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
              <h2 className="text-lg font-semibold mb-3 flex items-center">
                <PlusCircle className="w-5 h-5 mr-2 text-gray-600" />
                新增資料 (直接貼上網頁全選的純文字)
              </h2>
              <textarea
                className="w-full h-32 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition resize-y font-mono text-sm text-gray-600 leading-relaxed"
                placeholder="請在校務行政資料系統中，全校課務資料查詢->科目資料查詢(學系)查詢出來的資料，直接按下 Ctrl+A (全選) -> Ctrl+C (複製)，然後把文字貼在這裡...&#10;您也可以不斷貼上不同學期、不同系所的資料！"
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
              />
              {errorMsg && (
                <div className="mt-2 flex items-center text-red-600 text-sm">
                  <AlertCircle className="w-4 h-4 mr-1" />
                  {errorMsg}
                </div>
              )}
              <div className="mt-4 flex space-x-3">
                <button onClick={handleParse} className="flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition shadow-sm">
                  <Upload className="w-4 h-4 mr-2" /> 解析文字並加入清單
                </button>
                <button onClick={() => setInputText('')} className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition">
                  清空輸入框
                </button>
              </div>
            </section>

            {allData.length > 0 && (
              <section className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
                  <h2 className="text-lg font-semibold flex items-center">
                    <Search className="w-5 h-5 mr-2 text-gray-600" /> 資料篩選 (可加總特定條件)
                  </h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
                    <div>
                      <div className="flex justify-between items-end mb-1">
                        <label className="block text-sm font-medium text-gray-700">學年度 / 學期</label>
                        <span className="text-xs text-gray-400">未勾選為全部</span>
                      </div>
                      <div className="w-full border border-gray-300 rounded-lg p-2 bg-white max-h-40 overflow-y-auto space-y-1">
                        {uniqueYearSems.map(ys => (
                          <label key={ys} className="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer hover:bg-gray-50 p-1 rounded">
                            <input type="checkbox" className="rounded text-blue-600 w-4 h-4" checked={filters.yearSem.includes(ys)} onChange={() => toggleFilter('yearSem', ys)} />
                            <span className="truncate" title={ys}>{ys}</span>
                          </label>
                        ))}
                      </div>
                    </div>

                    <div>
                      <div className="flex justify-between items-end mb-1">
                        <label className="block text-sm font-medium text-gray-700">學制 / 系所</label>
                        <span className="text-xs text-gray-400">未勾選為全部</span>
                      </div>
                      <div className="w-full border border-gray-300 rounded-lg p-2 bg-white max-h-40 overflow-y-auto space-y-1">
                        {uniqueDepts.map(d => (
                          <label key={d} className="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer hover:bg-gray-50 p-1 rounded">
                            <input type="checkbox" className="rounded text-blue-600 w-4 h-4" checked={filters.dept.includes(d)} onChange={() => toggleFilter('dept', d)} />
                            <span className="truncate" title={d}>{d}</span>
                          </label>
                        ))}
                      </div>
                    </div>

                    <div>
                      <div className="flex justify-between items-end mb-1">
                        <label className="block text-sm font-medium text-gray-700">開課班級</label>
                        <span className="text-xs text-gray-400">未勾選為全部</span>
                      </div>
                      <div className="w-full border border-gray-300 rounded-lg p-2 bg-white max-h-40 overflow-y-auto space-y-1">
                        {uniqueClasses.map(c => (
                          <label key={c} className="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer hover:bg-gray-50 p-1 rounded">
                            <input type="checkbox" className="rounded text-blue-600 w-4 h-4" checked={filters.className.includes(c)} onChange={() => toggleFilter('className', c)} />
                            <span className="truncate" title={c}>{c}</span>
                          </label>
                        ))}
                      </div>
                    </div>

                    <div>
                      <div className="flex justify-between items-end mb-1">
                        <label className="block text-sm font-medium text-gray-700">學期</label>
                        <span className="text-xs text-gray-400">未勾選為全部</span>
                      </div>
                      <div className="w-full border border-gray-300 rounded-lg p-2 bg-white max-h-40 overflow-y-auto space-y-1">
                        {uniqueSemesterTypes.map(s => (
                          <label key={s} className="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer hover:bg-gray-50 p-1 rounded">
                            <input type="checkbox" className="rounded text-blue-600 w-4 h-4" checked={filters.semesterType.includes(s)} onChange={() => toggleFilter('semesterType', s)} />
                            <span className="truncate" title={s}>{s}</span>
                          </label>
                        ))}
                      </div>
                    </div>

                    <div>
                      <div className="flex justify-between items-end mb-1">
                        <label className="block text-sm font-medium text-gray-700">修別</label>
                        <span className="text-xs text-gray-400">未勾選為全部</span>
                      </div>
                      <div className="w-full border border-gray-300 rounded-lg p-2 bg-white max-h-40 overflow-y-auto space-y-1">
                        {uniqueReqTypes.map(r => (
                          <label key={r} className="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer hover:bg-gray-50 p-1 rounded">
                            <input type="checkbox" className="rounded text-blue-600 w-4 h-4" checked={filters.reqType.includes(r)} onChange={() => toggleFilter('reqType', r)} />
                            <span className="truncate" title={r}>{r}</span>
                          </label>
                        ))}
                      </div>
                    </div>

                    <div>
                      <div className="flex justify-between items-end mb-1">
                        <label className="block text-sm font-medium text-gray-700">授課教師</label>
                        <span className="text-xs text-gray-400">未勾選為全部</span>
                      </div>
                      <div className="w-full border border-gray-300 rounded-lg p-2 bg-white max-h-40 overflow-y-auto space-y-1">
                        {uniqueTeachers.map(t => (
                          <label key={t} className="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer hover:bg-gray-50 p-1 rounded">
                            <input type="checkbox" className="rounded text-blue-600 w-4 h-4" checked={filters.teacher.includes(t)} onChange={() => toggleFilter('teacher', t)} />
                            <span className={`truncate ${t === '' ? 'text-gray-400 italic' : ''}`} title={t === '' ? '(空白)' : t}>
                              {t === '' ? '(空白)' : t}
                            </span>
                          </label>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-gradient-to-br from-blue-50 to-blue-100 p-6 rounded-xl shadow-sm border border-blue-200 flex flex-col justify-center items-center text-center">
                  <div className="text-blue-800 font-medium mb-2">篩選結果統計</div>
                  <div className="flex space-x-8">
                    <div>
                      <div className="text-4xl font-black text-blue-600">{totalCredits}</div>
                      <div className="text-sm text-blue-700 mt-1">總學分數</div>
                    </div>
                    <div>
                      <div className="text-4xl font-black text-blue-600">{totalCourses}</div>
                      <div className="text-sm text-blue-700 mt-1">總科目數</div>
                    </div>
                  </div>
                </div>
              </section>
            )}

            {allData.length > 0 && (
              <section className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                <div className="p-4 border-b border-gray-200 flex flex-wrap justify-between items-center bg-gray-50 gap-3">
                  <h2 className="font-semibold text-gray-700 flex items-center">
                    資料清單 ({filteredData.length} 筆)
                    {selectedIds.length > 0 && (
                      <span className="ml-3 px-2.5 py-1 bg-blue-100 text-blue-700 text-xs rounded-full font-medium">
                        已選取 {selectedIds.length} 筆
                      </span>
                    )}
                  </h2>
                  <div className="flex flex-wrap items-center gap-2">
                    {selectedIds.length > 0 && (
                      <button 
                        onClick={handleDeleteSelected} 
                        className="flex items-center px-3 py-1.5 bg-red-600 text-white text-sm rounded-lg hover:bg-red-700 transition shadow-sm mr-2"
                      >
                        <XCircle className="w-4 h-4 mr-1.5" /> 刪除選取資料
                      </button>
                    )}
                    <button onClick={handleExport} className="flex items-center px-3 py-1.5 bg-green-600 text-white text-sm rounded-lg hover:bg-green-700 transition shadow-sm">
                      <Download className="w-4 h-4 mr-1.5" /> 匯出 Excel (CSV)
                    </button>
                    <button onClick={handleClearAll} className="flex items-center px-3 py-1.5 bg-red-50 text-red-600 text-sm rounded-lg hover:bg-red-100 transition border border-red-200">
                      <Trash2 className="w-4 h-4 mr-1.5" /> 清空所有資料
                    </button>
                  </div>
                </div>
                
                <div className="overflow-x-auto max-h-[600px]">
                  <table className="w-full text-left border-collapse min-w-[1200px]">
                    <thead className="bg-white sticky top-0 shadow-sm z-10">
                      <tr className="text-xs font-semibold text-gray-500 uppercase tracking-wider">
                        <th className="p-3 border-b border-gray-200 w-12 text-center">
                          <input 
                            type="checkbox" 
                            className="rounded text-blue-600 w-4 h-4 cursor-pointer" 
                            checked={isAllFilteredSelected}
                            onChange={handleSelectAllFiltered}
                            title="全選/取消全選目前篩選結果"
                          />
                        </th>
                        <th className="p-3 border-b border-gray-200">學年度/學期</th>
                        <th className="p-3 border-b border-gray-200">學制/系所</th>
                        <th className="p-3 border-b border-gray-200">編號</th>
                        <th className="p-3 border-b border-gray-200">代碼</th>
                        <th className="p-3 border-b border-gray-200">科目名稱</th>
                        <th className="p-3 border-b border-gray-200">開課班級</th>
                        <th className="p-3 border-b border-gray-200 bg-blue-50 text-blue-700 text-center">學分</th>
                        <th className="p-3 border-b border-gray-200 text-center">學期</th>
                        <th className="p-3 border-b border-gray-200 text-center">修別</th>
                        <th className="p-3 border-b border-gray-200 text-center">人數(選/限)</th>
                        <th className="p-3 border-b border-gray-200">授課教師</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100 text-sm">
                      {filteredData.length === 0 ? (
                        <tr>
                          <td colSpan="12" className="p-8 text-center text-gray-500">目前篩選條件下無符合的資料</td>
                        </tr>
                      ) : (
                        filteredData.map(item => {
                          const isSelected = selectedIds.includes(item.id);
                          return (
                            <tr key={item.id} className={`hover:bg-blue-50/50 transition cursor-default ${isSelected ? 'bg-blue-50' : ''}`}>
                              <td className="p-3 text-center border-l-2 border-transparent" style={{ borderColor: isSelected ? '#3b82f6' : 'transparent' }}>
                                <input 
                                  type="checkbox" 
                                  className="rounded text-blue-600 w-4 h-4 cursor-pointer"
                                  checked={isSelected}
                                  onChange={() => toggleSelection(item.id)}
                                />
                              </td>
                              <td className="p-3 text-gray-600 truncate max-w-[150px]" title={item.yearSem}>{item.yearSem}</td>
                              <td className="p-3 text-gray-600 truncate max-w-[150px]" title={item.dept}>{item.dept}</td>
                              <td className="p-3 font-mono text-gray-500">{item.courseNo}</td>
                              <td className="p-3 font-mono text-gray-500">{item.courseCode}</td>
                              <td className="p-3 font-medium text-gray-800">{item.courseName}</td>
                              <td className="p-3 text-gray-600">{item.className}</td>
                              <td className="p-3 text-center font-bold text-blue-600 bg-blue-50/30">{item.credits}</td>
                              <td className="p-3 text-center text-gray-600">{item.semesterType}</td>
                              <td className="p-3 text-center">
                                <span className={`px-2 py-1 rounded-full text-xs ${item.reqType.includes('必') ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                  {item.reqType}
                                </span>
                              </td>
                              <td className="p-3 text-center text-gray-500">
                                <span className={parseInt(item.enrolledStudents, 10) < 18 ? "text-red-600 font-bold" : ""}>
                                  {item.enrolledStudents}
                                </span> / {item.maxStudents}
                              </td>
                              <td className="p-3 text-gray-600">{item.teacher}</td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>
              </section>
            )}

            {/* 新增：自訂 Modal 視窗 */}
            {modal.isOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity">
                <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 transform transition-all">
                  <h3 className="text-lg font-bold text-gray-900 mb-2">{modal.title}</h3>
                  <p className="text-gray-600 mb-6">{modal.message}</p>
                  <div className="flex justify-end space-x-3">
                    {modal.type === 'confirm' && (
                      <button onClick={closeModal} className="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition font-medium">
                        取消
                      </button>
                    )}
                    <button onClick={handleModalConfirm} className="px-4 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition font-medium shadow-sm">
                      確定
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
