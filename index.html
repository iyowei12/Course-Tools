<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Tools Portal | 課程工具集</title>
    <meta name="description" content="高品質的課程管理與課表查詢工具集。支援班級課表轉換、快速查詢及開課總量計算。">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Gradients */
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            left: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            z-index: -1;
            filter: blur(80px);
            animation: move-bg 15s infinite alternate;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, transparent 70%);
            z-index: -1;
            filter: blur(80px);
            animation: move-bg 20s infinite alternate-reverse;
        }

        @keyframes move-bg {
            from { transform: translate(0, 0); }
            to { transform: translate(15%, 15%); }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            text-align: center;
            z-index: 1;
        }

        header {
            margin-bottom: 4rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        .tool-card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            text-decoration: none;
            color: var(--text-main);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out backwards;
        }

        .tool-card:nth-child(1) { animation-delay: 0.1s; }
        .tool-card:nth-child(2) { animation-delay: 0.2s; }
        .tool-card:nth-child(3) { animation-delay: 0.3s; }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
            opacity: 0;
            transition: var(--transition);
        }

        .tool-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 20px var(--primary-glow);
        }

        .tool-card:hover::before {
            opacity: 1;
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            color: var(--primary);
            transition: var(--transition);
        }

        .tool-card:hover .icon-wrapper {
            background: var(--primary);
            color: #fff;
            transform: scale(1.1) rotate(5deg);
        }

        .tool-card h2 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        .tool-card p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .action-link {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            margin-top: auto;
        }

        .action-link i {
            transition: var(--transition);
        }

        .tool-card:hover .action-link i {
            transform: translateX(5px);
        }

        footer {
            margin-top: 6rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .container { padding: 1.5rem; }
            header { margin-bottom: 2.5rem; }
            .tools-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Course Tools</h1>
        </header>

        <main class="tools-grid">
            <a href="class-schedule-converter.html" class="tool-card">
                <div class="icon-wrapper">
                    <i data-lucide="refresh-cw"></i>
                </div>
                <h2>班級課表轉換</h2>
                <div class="action-link">
                    立即使用 <i data-lucide="arrow-right"></i>
                </div>
            </a>

            <a href="schedule-query.html" class="tool-card">
                <div class="icon-wrapper">
                    <i data-lucide="search"></i>
                </div>
                <h2>課表快速查詢</h2>
                <div class="action-link">
                    立即使用 <i data-lucide="arrow-right"></i>
                </div>
            </a>

            <a href="course-load-calculator.html" class="tool-card">
                <div class="icon-wrapper">
                    <i data-lucide="calculator"></i>
                </div>
                <h2>開課總量計算</h2>
                <div class="action-link">
                    立即使用 <i data-lucide="arrow-right"></i>
                </div>
            </a>
        </main>

        <footer>
            <p>&copy; 2026 Course Tools Portal. Crafted with precision.</p>
        </footer>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
